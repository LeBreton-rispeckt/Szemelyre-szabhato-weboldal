<section class="hero">
  <h1>Every photo is <em>grey</em>.<br>Until you say otherwise.</h1>
  <p>Seven photos, all in black and white. Use the colour settings below to bring them back to life: add colour, tint them, spin the hue.</p>
</section>

<section class="controls" aria-label="Colour settings">
  <div class="row">
    <div class="ctl"><label>Colour <output id="o_sat">0%</output></label><input id="sat" type="range" min="0" max="200" value="0"></div>
    <div class="ctl"><label>Tint <output id="o_tint">0%</output></label><input id="tint" type="range" min="0" max="100" value="0"></div>
    <div class="ctl"><label>Hue <output id="o_hue">0°</output></label><input id="hue" type="range" min="0" max="360" value="0"></div>
    <div class="ctl"><label>Contrast <output id="o_con">100%</output></label><input id="con" type="range" min="50" max="150" value="100"></div>
    <div class="ctl"><label>Brightness <output id="o_bri">100%</output></label><input id="bri" type="range" min="50" max="150" value="100"></div>
  </div>
  <div class="bar">
    <button data-p="0,0,0,100,100">Black &amp; white</button>
    <button data-p="100,0,0,100,100">Natural</button>
    <button data-p="170,0,0,112,100">Vivid</button>
    <button data-p="0,85,0,100,100">Sepia</button>
    <button data-p="0,100,170,105,100">Cyanotype</button>
    <button data-p="190,0,300,120,100">Neon</button>
    <button id="resetp">Reset photos</button>
    <button id="add-photos" type="button">Add your own photos</button>
    <input id="photo-files" type="file" accept="image/*" multiple hidden>
    <span id="upload-status" role="status" aria-live="polite"></span>
    <span id="hint"></span>
  </div>
</section>

    <figcaption><b>Downtown Glow</b><span>07</span></figcaption>
    <div class="pc"><label>This photo's colour <output class="pv">0%</output></label><input class="pcol" type="range" min="0" max="200" value="0" aria-label="Colour for this photo"></div>
  </figure>
</main>

<footer>Move the sliders to change the colour settings.</footer>

<script>
const root=document.documentElement,ids=['sat','tint','hue','con','bri'],el={};
const fmt={sat:v=>v+'%',tint:v=>v+'%',hue:v=>v+'°',con:v=>v+'%',bri:v=>v+'%'};
const val={sat:v=>v/100,tint:v=>v/100,hue:v=>v,con:v=>v/100,bri:v=>v/100};
ids.forEach(i=>{el[i]=document.getElementById(i);el[i].addEventListener('input',update)});
function update(){
  document.querySelectorAll('figure').forEach(f=>{
    const p=f.querySelector('.pcol'); if(!p) return;
    const own=+p.value;
    f.style.setProperty('--esat',Math.min(200,+el.sat.value+own)/100);
    f.querySelector('.pv').textContent=own+'%';
  });
  ids.forEach(i=>{
    const v=+el[i].value;
    root.style.setProperty('--'+i,val[i](v));
    document.getElementById('o_'+i).textContent=fmt[i](v);
  });
  const sat=+el.sat.value,tint=+el.tint.value,hue=+el.hue.value;
  const bw=sat===0&&tint===0;
  root.style.setProperty('--acc',bw?'':'hsl('+((tint>0&&sat<5?35:200)+hue)%360+' '+Math.max(40,Math.min(90,sat/2+tint/2))+'% 55%)');
  if(bw)root.style.removeProperty('--acc');
  const any=[...document.querySelectorAll('.pcol')].some(p=>+p.value>0);
  document.getElementById('hint').textContent=bw&&any?'Some photos coloured individually.':bw?'Still black & white. Raise Colour or Tint.':(sat===0?'Monochrome tone. Spin the hue.':'Colour unlocked.');
}
document.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{
  b.dataset.p.split(',').forEach((v,i)=>el[ids[i]].value=v);update();
}));
function resetPhotos(){document.querySelectorAll('.pcol').forEach(p=>p.value=0);update();}
document.querySelectorAll('.pcol').forEach(p=>p.addEventListener('input',update));
document.getElementById('resetp').addEventListener('click',resetPhotos);
document.querySelector('[data-p="0,0,0,100,100"]').addEventListener('click',resetPhotos);
let figs=[...document.querySelectorAll('#gallery figure')];
let idx=0;
function show(i){
  idx=(i+figs.length)%figs.length;
  figs.forEach((f,k)=>f.classList.toggle('on',k===idx));
  document.getElementById('count').textContent=(idx+1)+' / '+figs.length;
  document.getElementById('download-status').textContent='';
}
document.getElementById('download-photo').addEventListener('click',()=>{
  const image=figs[idx].querySelector('img');
  const status=document.getElementById('download-status');
  if(!image.complete||!image.naturalWidth){
    status.textContent='This photo is not ready to download yet.';
    return;
  }
  const canvas=document.createElement('canvas');
  canvas.width=image.naturalWidth;
  canvas.height=image.naturalHeight;
  const context=canvas.getContext('2d');
  if(!context){
    status.textContent='Could not create the edited image.';
    return;
  }
  context.filter=getComputedStyle(image).filter;
  context.drawImage(image,0,0);
  canvas.toBlob(blob=>{
    if(!blob){
      status.textContent='Could not create the edited image.';
      return;
    }
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    const caption=figs[idx].querySelector('figcaption b')?.textContent||'edited-photo';
    const filename=caption.trim().replace(/[<>:"/\\|?*\x00-\x1f]/g,'-')||'edited-photo';
    link.href=url;
    link.download=filename+'.png';
    link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    status.textContent='Downloaded '+filename+'.png';
  },'image/png');
});
const photoFiles=document.getElementById('photo-files');
const photoUrls=[];
document.getElementById('add-photos').addEventListener('click',()=>photoFiles.click());
photoFiles.addEventListener('change',()=>{
  const files=[...photoFiles.files];
  photoFiles.value='';
  if(!files.length)return;
  const validFiles=files.filter(file=>file.type.startsWith('image/'));
  const rejected=files.length-validFiles.length;
  const status=document.getElementById('upload-status');
  status.textContent=rejected?rejected+' file(s) skipped; choose image files.':'';
  const added=[];
  validFiles.forEach(file=>{
    const url=URL.createObjectURL(file);
    photoUrls.push(url);
    const figure=document.createElement('figure');
    const image=document.createElement('img');
    image.alt=file.name;
    image.src=url;
    const caption=document.createElement('figcaption');
    const name=document.createElement('b');
    name.textContent=file.name.replace(/\.[^.]+$/,'')||'My photo';
    const number=document.createElement('span');
    number.textContent=String(figs.length+added.length+1).padStart(2,'0');
    caption.append(name,number);
    const controls=document.createElement('div');
    controls.className='pc';
    const label=document.createElement('label');
    label.textContent="This photo's colour";
    const output=document.createElement('output');
    output.className='pv';
    output.textContent='0%';
    label.append(output);
    const slider=document.createElement('input');
    slider.className='pcol';
    slider.type='range';
    slider.min='0';
    slider.max='100';
    slider.value='0';
    slider.setAttribute('aria-label','Colour for '+name.textContent);
    slider.addEventListener('input',update);
    controls.append(label,slider);
    figure.append(image,caption,controls);
    document.getElementById('gallery').append(figure);
    added.push(figure);
    image.addEventListener('error',()=>{
      status.textContent='Could not load '+file.name+'.';
      URL.revokeObjectURL(url);
      const failedIndex=figs.indexOf(figure);
      figure.remove();
      figs=figs.filter(item=>item!==figure);
      if(failedIndex>=0){
        if(idx>failedIndex)idx--;
        show(idx);
      }
    },{once:true});
  });
  if(added.length){
    figs=[...document.querySelectorAll('#gallery figure')];
    show(figs.indexOf(added[0]));
    update();
  }
});
window.addEventListener('beforeunload',()=>photoUrls.forEach(url=>URL.revokeObjectURL(url)));
document.getElementById('prev').addEventListener('click',()=>show(idx-1));
document.getElementById('next').addEventListener('click',()=>show(idx+1));
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowLeft')show(idx-1);
  if(e.key==='ArrowRight')show(idx+1);
});
let sx=null;const g=document.getElementById('gallery');
g.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
g.addEventListener('touchend',e=>{
  if(sx===null||e.target.tagName==='INPUT'){sx=null;return}
  const d=e.changedTouches[0].clientX-sx;sx=null;
  if(Math.abs(d)>50)show(idx+(d<0?1:-1));
});
show(0);
update();
</script>
</body>
</html>
